<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento Inteligente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Monitoramento de Vaga</h1>
       
        <div id="status-luz" class="luz apagada"></div>
       
        <div class="info">
            <p>Status: <strong id="status-texto">Conectando ao FastAPI...</strong></p>
            <p>Distância: <strong id="distancia-texto">--</strong> cm</p>
        </div>
    </div>

    <div class="historico-container">
        <h2>Histórico de Incidentes</h2>
        <table>
            <thead>
                <tr>
                    <th>Horário do Alerta</th>
                    <th>Distância da Parede</th>
                    <th>Ocorrência</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
